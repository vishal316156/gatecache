services:

  backend-1:
    build: .
    container_name: gatecache-backend-1
    command: ["node", "mock-backend/server.js", "4001"]
    ports:
      - "4001:4001"
    restart: unless-stopped

  backend-2:
    build: .
    container_name: gatecache-backend-2
    command: ["node", "mock-backend/server.js", "4002"]
    ports:
      - "4002:4002"
    restart: unless-stopped

  backend-3:
    build: .
    container_name: gatecache-backend-3
    command: ["node", "mock-backend/server.js", "4003"]
    ports:
      - "4003:4003"
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: gatecache-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: gatecache-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seed:
    build: .
    container_name: gatecache-seed
    command: ["node", "scripts/seed.js"]
    environment:
      MONGO_URI: mongodb://mongodb:27017/gatecache
    depends_on:
      mongodb:
        condition: service_healthy

  gatecache:
    build: .
    container_name: gatecache
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/gatecache
      REDIS_URL: redis://redis:6379
      JWT_SECRET: development_secret_change_later
      CACHE_MAX_SIZE: 1000
      CACHE_DEFAULT_TTL: 60000
      RATE_LIMIT_WINDOW: 60000
      RATE_LIMIT_MAX_REQUESTS: 100
      RATE_LIMIT_STRATEGY: token-bucket
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data: